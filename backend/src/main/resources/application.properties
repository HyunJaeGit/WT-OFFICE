server.address=127.0.0.1
server.port=8080

spring.datasource.url=jdbc:sqlite:./wt-office.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.datasource.hikari.maximum-pool-size=1

app.ai.enabled=${AI_ENABLED:false}
app.ai.model=${OPENAI_MODEL:gpt-6-luna}
app.ai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
app.ai.max-output-tokens=1500
app.ai.timeout-seconds=45

